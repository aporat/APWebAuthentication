name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Tests on iOS Simulator (latest)
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set Project Scheme
        run: echo "scheme=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Select iOS Simulator Destination
        run: |
          destination=$(python3 <<'EOF'
          import json, subprocess
          runtimes = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "runtimes", "-j"]))["runtimes"]
          ios = [r for r in runtimes if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS")]
          ios.sort(key=lambda r: [int(p) for p in r["version"].split(".")])
          rt = ios[-1]
          devices = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "-j"]))["devices"].get(rt["identifier"], [])
          iphones = [d for d in devices if d.get("isAvailable") and "iPhone" in d["name"]]
          name = iphones[-1]["name"] if iphones else "iPhone 16"
          print(f"platform=iOS Simulator,name={name},OS={rt['version']}")
          EOF
          )
          echo "Selected destination: $destination"
          echo "destination=$destination" >> "$GITHUB_ENV"

      - name: Run Tests with Code Coverage
        run: |
          set -o pipefail && \
          xcodebuild \
            -scheme "${{ env.scheme }}" \
            -destination "${{ env.destination }}" \
            -enableCodeCoverage YES \
            -derivedDataPath ./DerivedData \
            -resultBundlePath ./TestResults.xcresult \
            test

      - name: Install xcresultparser
        run: brew install xcresultparser

      - name: Generate Coverage Report
        run: |
          mkdir -p ./coverage
          xcresultparser \
            --output-format cobertura \
            ./TestResults.xcresult > ./coverage/cobertura.xml

      - name: Convert Test Results to JUnit
        run: |
          xcresultparser \
            --output-format junit \
            ./TestResults.xcresult > ./test-results.xml

      - name: Upload Code Coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
          files: ./coverage/cobertura.xml

      - name: Upload Test Results to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          slug: ${{ github.repository }}
          files: ./test-results.xml

  test-minimum:
    # Package.swift declares iOS 17.4 as the deployment target. The resolved
    # dependency graph (DeviceKit 5.9.0) needs Swift 6.1, i.e. Xcode 16.3+, and
    # no GitHub-hosted image ships Xcode 16.3+ together with an iOS 17.4
    # simulator (macos-14 tops out at Xcode 16.2; macos-15 ships iOS 18.0+
    # runtimes only). So this lane uses macos-15 + Xcode 16.4 and downloads the
    # iOS 17.4 simulator runtime.
    name: Tests on iOS 17.4 Simulator (minimum)
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Set Project Scheme
        run: echo "scheme=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Install iOS 17.4 Simulator Runtime
        run: |
          if ! xcrun simctl list runtimes | grep -q "iOS 17.4"; then
            xcodebuild -downloadPlatform iOS -buildVersion 17.4
          fi
          xcrun simctl list runtimes

      - name: Create iOS 17.4 Simulator
        run: |
          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r.get("isAvailable") and r["identifier"].startswith("com.apple.CoreSimulator.SimRuntime.iOS") and r["version"].startswith("17.4")))')
          udid=$(xcrun simctl create "iPhone 15 (iOS 17.4)" "com.apple.CoreSimulator.SimDeviceType.iPhone-15" "$runtime")
          echo "Created simulator $udid on $runtime"
          echo "destination=platform=iOS Simulator,id=$udid" >> "$GITHUB_ENV"

      - name: Run Tests
        run: |
          set -o pipefail && \
          xcodebuild \
            -scheme "${{ env.scheme }}" \
            -destination "${{ env.destination }}" \
            -derivedDataPath ./DerivedData \
            test

  lint:
    name: SwiftLint
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install SwiftLint
        run: command -v swiftlint >/dev/null || brew install swiftlint

      - name: Run SwiftLint
        # Non-strict: warnings are reported as annotations, errors fail the job.
        run: |
          swiftlint version
          swiftlint lint --reporter github-actions-logging
